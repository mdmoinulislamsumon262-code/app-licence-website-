services:
  - type: web
    name: deviceguard
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build && pnpm --filter @workspace/db run push-force
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SESSION_SECRET
        generateValue: true
      - key: DEVICEGUARD_ADMIN_USERNAME
        sync: false
      - key: DEVICEGUARD_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: deviceguard-db
          property: connectionString

databases:
  - name: deviceguard-db
    plan: free